[package]
name = "ccosel-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The CCOSEL server: hosts the shell, serves app modules, answers RPC."

[dependencies]
ccosel-proto = { workspace = true, features = ["std"] }
ccosel-view3d = { workspace = true }
# Content-addresses meshes (`/cad/mesh/<hash>`), as ARCHITECTURE.md plans for all CAS URLs.
blake3 = "1"
# Checks the FreeCAD download against its pinned checksum (FreeCAD publishes SHA-256).
sha2 = "0.10"
anyhow = { workspace = true }
axum = "0.8"
dotenvy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip"] }
postcard = { workspace = true, features = ["use-std"] }
serde = { workspace = true, features = ["std"] }
serde_json = "1"
# OAuth is one outbound HTTPS call (token exchange) plus one GET (whoami), against a provider
# this project does not control — hand-rolling TLS for that is not worth it the way it is for
# the four-line, same-process POST in rpc_http.rs's own test client. rustls (not native-tls) so
# the build never depends on a system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"

[dev-dependencies]
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
