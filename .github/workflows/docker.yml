# Publishes the Docker image to ghcr.io/<owner>/ccosel, so a server can update by pulling it
# (in Portainer: Stacks -> ccosel -> Update the stack, with "Re-pull image" on) instead of
# building the image itself.
#
# It runs only after CI has passed on a push to `main`, so a commit that fails CI is never
# published. Tags: `latest`, and `sha-<short sha>` to go back to an exact build.
# Run it by hand from the Actions tab (workflow_dispatch) to republish without a new commit.
name: Docker image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# A newer build makes an older one pointless, and cancelling the older one stops it finishing
# last and pointing `latest` back at older code.
concurrency:
  group: docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # `branches: [main]` above matches a fork's PR from a branch that happens to be called
    # `main`, so also require a push to this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The commit CI passed on. Under workflow_run, github.sha is main's tip *now*, which may
      # be a newer commit that hasn't passed CI yet.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}

      - name: Image name and tags
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ccosel"
          echo "tags=$image:latest,$image:sha-${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `context: .` builds the checkout above. Without it the action fetches github.sha
      # itself, which is the wrong commit under workflow_run (see SHA).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
